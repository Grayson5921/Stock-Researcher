# Local development dependencies: Postgres + Redis.
# Usage: docker compose up -d  (then `npm run migrate`)
services:
  postgres:
    image: postgres:16-alpine
    container_name: stockresearcher_postgres
    environment:
      POSTGRES_USER: stockresearcher
      POSTGRES_PASSWORD: stockresearcher
      POSTGRES_DB: stockresearcher
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockresearcher"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stockresearcher_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
