# Render Blueprint: deploys the whole stack (web + worker + Postgres + Redis).
# In Render: New -> Blueprint -> select this repo. You'll be prompted for the
# three secrets marked sync:false. Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ninecritics-web
    runtime: node
    plan: starter
    # include=dev: next build + tsx need devDependencies even with NODE_ENV=production
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run migrate && npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ninecritics-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ninecritics-redis
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false # paste your Anthropic key in the Render dashboard
      - key: STRIPE_SECRET_KEY
        sync: false # sk_test_... first; switch to sk_live_... when going live
      - key: STRIPE_WEBHOOK_SECRET
        sync: false # whsec_... from the Stripe webhook endpoint you create
      - key: RESEARCH_RUN_PRICE_CENTS
        value: "2000"
      - key: JOB_COST_CEILING_USD
        value: "15"
      - key: GLOBAL_DAILY_BUDGET_USD
        value: "500"
      - key: MARKET_DATA_PROVIDER
        value: finnhub
      - key: FINNHUB_API_KEY
        sync: false
      - key: SEC_USER_AGENT
        value: "nine-critics contact@ninecritics.example" # put a REAL contact email here
      # APP_URL falls back to RENDER_EXTERNAL_URL automatically (src/lib/env.ts).
      # Set APP_URL explicitly once you attach a custom domain.

  - type: worker
    name: ninecritics-worker
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ninecritics-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ninecritics-redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JOB_COST_CEILING_USD
        value: "15"
      - key: MARKET_DATA_PROVIDER
        value: finnhub
      - key: FINNHUB_API_KEY
        sync: false
      - key: SEC_USER_AGENT
        value: "nine-critics contact@ninecritics.example"

  - type: redis
    name: ninecritics-redis
    plan: starter
    maxmemoryPolicy: noeviction # BullMQ requires noeviction
    ipAllowList: [] # internal connections only

databases:
  - name: ninecritics-db
    plan: basic-256mb
