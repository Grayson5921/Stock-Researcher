<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96" role="img" aria-label="Nine Critics">
  <!-- Mark: 3x3 critic panel, eight approve, one dissenter outlined. -->
  <g>
    <rect x="6"  y="6"  width="24" height="24" rx="6" fill="#1f6feb"/>
    <rect x="36" y="6"  width="24" height="24" rx="6" fill="#1f6feb"/>
    <rect x="66" y="6"  width="24" height="24" rx="6" fill="#1f6feb"/>
    <rect x="6"  y="36" width="24" height="24" rx="6" fill="#1f6feb"/>
    <rect x="36" y="36" width="24" height="24" rx="6" fill="#1f6feb"/>
    <rect x="66" y="36" width="24" height="24" rx="6" fill="#1f6feb"/>
    <rect x="6"  y="66" width="24" height="24" rx="6" fill="#1f6feb"/>
    <rect x="36" y="66" width="24" height="24" rx="6" fill="#1f6feb"/>
    <rect x="67.5" y="67.5" width="21" height="21" rx="5" fill="none" stroke="#cf222e" stroke-width="3"/>
  </g>
  <!-- Wordmark (system sans; convert to outlines for print). -->
  <text x="112" y="52" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="40" font-weight="800" letter-spacing="-1" fill="#1a1d21">Nine Critics</text>
  <text x="113" y="80" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="17" font-weight="600" letter-spacing="6" fill="#5b6472">RESEARCH</text>
</svg>
